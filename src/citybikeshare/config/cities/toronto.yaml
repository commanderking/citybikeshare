name: toronto
system_name: toronto_bikeshare
source_url: "https://open.toronto.ca/dataset/bike-share-toronto-ridership-data/"
aws_sync: false
file_matcher:
  - .csv
# The 2024 monthly files (bike_share_ridership_2024-01..09, Jan–Sep) duplicate the full-year
# annual bikeshare-ridership-2024 — same trips, so counts would inflate. Exclude the monthly
# ones (the annual is the complete year). The 2023 monthly files have no annual counterpart, so
# this substring is scoped to 2024- and leaves them untouched.
excluded_filenames:
  - "bike_share_ridership_2024-"
renamed_columns:
  trip_id: trip_id
  trip_start_time: start_time
  trip_stop_time: end_time
  trip_duration_seconds: duration
  from_station_name: start_station_name
  to_station_name: end_station_name
  user_type: membership_type

  Trip Id: trip_id
  Trip  Duration: duration
  Start Station Id: start_station_id
  Start Time: start_time
  Start Station Name: start_station_name
  End Station Id: end_station_id
  End Time: end_time
  End Station Name: end_station_name
  Bike Id: bike_id
  User Type: membership_type

  # Late-2025 format switched to underscore Title-Case headers
  Trip_Id: trip_id
  Trip_Duration: duration
  Start_Station_Id: start_station_id
  Start_Time: start_time
  Start_Station_Name: start_station_name
  End_Station_Id: end_station_id
  End_Time: end_time
  End_Station_Name: end_station_name
  Bike_Id: bike_id
  User_Type: membership_type
  # Bike-model column: "Model" in the 2024 monthly files, "Bike_Model" from 2025 on. Both feed
  # the two-layer bike_type/bike_model via normalize_bike_type — ICONIC=classic, EFIT/EFIT G5/
  # ASTRO=electric. (The duplicate 2024 monthly files are dropped via excluded_filenames above.)
  Model: bike_type
  Bike_Model: bike_type

final_columns:
  - start_time
  - end_time
  - start_station_name
  - end_station_name
  - membership_type
  - bike_id
  - bike_type
  - bike_model

date_formats:
  - "%m/%d/%Y %H:%M"
  - "%m/%d/%Y %H:%M:%S"
  - "%d/%m/%Y %H:%M"
  - "%Y-%m-%d %H:%M:%S"
read_csv_options:
  encoding: utf8-lossy
  null_values:
    - "NULLNULL"   # one corrupt end_time in bikeshare_ridership_(2017_q4) → treat as missing
clean_pipeline:
  # 2020-10.csv.gz has 249 rows (of 277,839) missing the comma between Trip Id and Trip Duration,
  # so every later column shifts one left and station names land in start_time. Scoped to that
  # one file: every other raw file is copied into cleaned/ untouched (see
  # toronto_split_fused_trip_id for the split rule and how it was verified).
  - step: toronto_split_fused_trip_id
    files: ["2020-10.csv.gz"]
  # 2016 ships as an xlsx workbook (Q3 + Q4 sheets) with the 2017 CSV column layout. Excel
  # mangled the Q4 dates: a d/m/yyyy text export was re-parsed as m/d, so days ≤12 became
  # date serials with day and month swapped, while days ≥13 stayed as text. expected_months
  # is the guard on that swap — un-swapping correct dates would scatter Q4 across the year.
  - step: convert_xlsx_sheets
    files: ["bikeshare-ridership-2016.xlsx.gz"]
    sheets:
      "tor_trips_2016_Q3 ":   # trailing space is in the source
        date_columns: [trip_start_time, trip_stop_time]
      tor_trips_2016_Q4:
        date_columns: [trip_start_time, trip_stop_time]
        text_date_format: "%d/%m/%Y %H:%M"
        serial_dates_day_month_swapped: true
        expected_months: [10, 11, 12]
compress_cleaned: true
# Published alongside the trips but not trip data: the field-description readme, and 2014–2015,
# which is monthly station-pair counts with no timestamps.
ignored_raw_files:
  - bikeshare-ridership-readme.xlsx.gz
  - bikeshare-ridership-2014-2015.xlsx.gz
# One 2016 Q3 trip is stamped with an epoch-garbage date on both ends.
invalid_values:
  start_time: ["2000-01-01 14:40:00"]
processing_pipeline:
  - rename_columns
  - remove_invalid_rows   # matches the raw string, so it must precede convert_to_datetime
  - convert_to_datetime
  - normalize_bike_type
  - select_final_columns
  - offset_two_digit_years
  - cast_optional_columns
