name: pittsburgh
system_name: pittsburgh_bikeshare
source_url: "https://data.wprdc.org/dataset/pogoh-trip-data"
aws_sync: false
file_matcher:
  - csv
renamed_columns:
  _id: row_number
  Closed Status: closed_status
  Duration: duration
  Start Station Id: start_station_id
  Start Date: start_time
  Start Station Name: start_station_name
  End Date: end_time
  End Station Id: end_station_id
  End Station Name: end_station_name
  Rider Type: membership_type

  Trip id: id
  Starttime: start_time
  Stoptime: end_time
  Bikeid: bike_id
  Tripduration: duration
  From station id: start_station_id
  From station name: start_station_name
  To station id: end_station_id
  To station name: end_station_name
  Usertype: membership_type

  trip_id: id
  starttime: start_time
  stoptime: end_time
  bikeid: bike_id
  tripduration: duration
  from_station_id: start_station_id
  from_station_name: start_station_name
  to_station_id: end_station_id
  to_station_name: end_station_name
  usertype: membership_type

final_columns:
- start_time
- end_time
- start_station_name
- end_station_name
- bike_id
- membership_type

date_formats:
  - "%m/%d/%Y %H:%M"
  - "%Y-%m-%dT%H:%M:%S"
  - "%Y-%m-%d %H:%M:%S"   # space separator (2026-05+ exports); same as the T variant above
  - "%a, %b %d, %Y, %I:%M %p"
processing_pipeline:
  - rename_columns
  - convert_to_datetime
  - select_final_columns
  - cast_optional_columns

# Months the coverage check allows because of a defect not yet fixed. Remove an entry once
# its fix lands — the check fails while a listed month is complete.
known_gaps:
  # TODO: the downloader's WPRDC datastore_search call returns at most 32,000 rows and some
  # monthly resources failed to download, so these months are truncated or missing.
  - "2015-09"
  - "2019-06"
  - "2019-09"
  - "2021-06"
  - "2021-09"
  - "2024-01"
  - "2024-04"
  - "2024-08..2024-12"
  - "2025-02..2025-04"
  - "2025-07..2025-11"
  - "2026-02..2026-03"
